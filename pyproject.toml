[project]
name = "openfoam-mcp"
version = "0.1.0"
description = "Model Context Protocol server for OpenFOAM: set up, mesh, run, monitor and visualise CFD cases from any MCP client."
readme = "README.md"
license = "MIT"
authors = [{ name = "0xFFD" }]
requires-python = ">=3.10"
keywords = ["openfoam", "cfd", "mcp", "model-context-protocol", "llm", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "mcp>=2.0,<3",
    "numpy>=1.22",
    "matplotlib>=3.5",
    "tomlkit>=0.12",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
    "pillow>=9",
]

[project.urls]
Homepage = "https://github.com/0xFFD/openfoam-mcp"
Repository = "https://github.com/0xFFD/openfoam-mcp"
Issues = "https://github.com/0xFFD/openfoam-mcp/issues"
Changelog = "https://github.com/0xFFD/openfoam-mcp/blob/main/CHANGELOG.md"

[project.scripts]
openfoam-mcp = "openfoam_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openfoam_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real OpenFOAM cases (skipped when OpenFOAM is missing)"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731", "E501"]  # long tool-description strings are intentional

[tool.hatch.build.targets.sdist]
exclude = ["docs/images", ".github", "uv.lock"]
